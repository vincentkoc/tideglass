version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    # crawlkit ships frequent patch releases; batch them into one weekly PR
    # instead of one PR per release (see #11-#20).
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns:
          - "*"
    labels:
      - dependencies
      - go
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
